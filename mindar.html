<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Reconhecimento do Resistor</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    .mensagem-instrucao {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      background-color: rgba(255, 255, 255, 0.9);
      color: #1f2933;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }
  </style>
</head>

<body>
  <p class="mensagem-instrucao">
    Aponte a câmera para a imagem da Estação do Resistor.
  </p>

  <a-scene
    mindar-image="imageTargetSrc: ar/resistor.mind;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    color-space="sRGB"
    renderer="colorManagement: true"
  >
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <a-entity
      id="alvo-resistor"
      mindar-image-target="targetIndex: 0"
    >
      <a-plane
        color="#f28c28"
        opacity="0.65"
        transparent="true"
        width="1"
        height="0.67"
        position="0 0 0.01"
      ></a-plane>

      <a-text
        value="ALVO RECONHECIDO"
        align="center"
        color="#ffffff"
        width="2"
        position="0 0 0.03"
      ></a-text>
    </a-entity>
  </a-scene>
</body>

</html>
