<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Primeira cena A-Frame</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>

<body>
  <a-scene
    background="color: #eef3f7"
    vr-mode-ui="enabled: false"
  >
    <a-text
      value="ESTACAO DO RESISTOR"
      color="#1f2933"
      align="center"
      width="6"
      position="0 2.5 -3"
    ></a-text>

    <a-box
      color="#1f5f8b"
      position="0 1 -3"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"
    ></a-box>

    <a-plane
      color="#cfd8df"
      width="12"
      height="12"
      position="0 0 -4"
      rotation="-90 0 0"
    ></a-plane>

    <a-light
      type="ambient"
      color="#ffffff"
      intensity="0.7"
    ></a-light>

    <a-light
      type="directional"
      color="#ffffff"
      intensity="0.8"
      position="1 4 2"
    ></a-light>

    <a-camera position="0 1.6 0"></a-camera>
  </a-scene>
</body>

</html>
